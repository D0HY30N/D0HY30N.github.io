backend:
  name: github
  repo: D0HY30N/D0HY30N.github.io
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'post: create {{slug}}'
    update: 'post: update {{slug}}'
    delete: 'post: remove {{slug}}'
    uploadMedia: 'media: add {{path}}'
    deleteMedia: 'media: remove {{path}}'

site_url: https://d0hy30n.github.io
display_url: https://d0hy30n.github.io

media_folder: /public/images/posts
public_folder: /images/posts
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: '-'
  trim: true
  lowercase: false
  timezone: Asia/Seoul

collections:
  - name: posts
    label: 블로그 글
    label_singular: 글
    folder: /src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    identifier_field: title
    slug: "{{published | date('YYYY-MM-DD')}}-{{slug}}"
    preview_path: posts/{{slug}}/
    summary: '{{title}} · {{published | date("YYYY-MM-DD")}}'
    sortable_fields: [published, title]
    fields:
      - name: title
        label: 제목
        widget: string
        maxlength: 120

      - name: published
        label: 작성일
        widget: datetime
        type: date
        default: '{{now}}'

      - name: updated
        label: 수정일
        widget: datetime
        type: date
        required: false

      - name: description
        label: 요약
        widget: text
        required: false
        hint: 글 목록과 검색 결과에 표시되는 짧은 설명입니다.

      - name: image
        label: 표지 이미지
        widget: image
        required: false

      - name: tags
        label: 태그
        widget: list
        required: false
        max: 20
        allow_duplicate: false
        field:
          name: tag
          label: 태그
          widget: string

      - name: category
        label: 카테고리
        widget: list
        required: false
        max: 2
        allow_duplicate: false
        hint: 첫 번째는 대분류, 두 번째는 소분류입니다. 최대 2개까지 입력하세요.
        field:
          name: category_name
          label: 카테고리명
          widget: string

      - name: draft
        label: 초안
        widget: boolean
        default: true
        required: false
        hint: 켜져 있으면 실제 블로그에는 공개되지 않습니다.

      - name: lang
        label: 글 언어
        widget: select
        default: ko
        required: false
        options:
          - { label: 한국어, value: ko }
          - { label: English, value: en }
          - { label: 日本語, value: ja }

      - name: body
        label: 본문
        widget: richtext
        modes: [rich_text, raw]
        sanitize_preview: true
        editor_components: [image, code-block]
