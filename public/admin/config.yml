# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.211.4/schema/sveltia-cms.json
backend:
  name: github
  repo: D0HY30N/D0HY30N.github.io
  branch: main
  auth_methods: [token]

site_url: https://d0hy30n.github.io
display_url: https://d0hy30n.github.io
media_folder: public/images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      max_file_size: 10485760
slug:
  encoding: unicode
  lowercase: false
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: 게시글
    label_singular: 게시글
    folder: src/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    nested:
      depth: 10
      subfolders: false
    meta:
      path: {}
    summary: '{{title}}'
    sortable_fields: [published, title, parentCategory, category]
    view_groups:
      - label: 대카테고리
        field: parentCategory
      - label: 소카테고리
        field: category
    fields:
      - { name: title, label: 제목, widget: string }
      - name: published
        label: 작성일
        widget: datetime
        default: '{{now}}'
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - name: updated
        label: 수정일
        widget: datetime
        required: false
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - name: description
        label: 글 요약
        widget: text
        required: false
      - name: parentCategory
        label: 대카테고리
        widget: hidden
        default: ''
      - name: category
        label: 소카테고리
        widget: hidden
        default: ''
      - name: tags
        label: 태그
        widget: list
        required: false
        default: []
      - name: image
        label: 대표 이미지
        widget: image
        required: false
      - name: draft
        label: 초안으로 보관
        widget: boolean
        default: true
      - name: lang
        label: 본문 언어
        widget: string
        required: false
        default: ko
      - name: body
        label: 본문
        widget: markdown-source

  - name: pages
    label: 페이지
    files:
      - name: about
        label: About
        file: src/content/spec/about.md
        format: yaml-frontmatter
        fields:
          - name: body
            label: 본문
            widget: markdown-source
            required: false

  - name: writing-guides
    label: 작성 가이드
    description: CMS에서 참고하는 읽기 전용 문서입니다. 블로그 글 목록과 검색에는 포함되지 않습니다.
    files:
      - name: markdown-guide
        label: 마크다운 문법
        file: cms/guides/markdown.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: 가이드, widget: string, readonly: true }
          - name: body
            label: 문법 예제 원문
            widget: markdown-source
            readonly: true
      - name: fuwari-guide
        label: Fuwari 확장 문법
        file: cms/guides/fuwari.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: 가이드, widget: string, readonly: true }
          - name: body
            label: 문법 예제 원문
            widget: markdown-source
            readonly: true
